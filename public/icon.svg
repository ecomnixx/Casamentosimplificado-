<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E7760" />
      <stop offset="100%" stop-color="#3D523F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Golden Ring / Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.4" />

  <!-- Wedding Rings Interlocking Symbol -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- First Ring (Left) -->
    <circle cx="210" cy="245" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="26" />
    <!-- Second Ring (Right) -->
    <circle cx="302" cy="245" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="26" />
    
    <!-- Sparkle / Diamond atop Left Ring -->
    <polygon points="210,110 219,132 241,141 219,150 210,172 201,150 179,141 201,132" fill="#FFFFFF" />
    <circle cx="210" cy="141" r="5" fill="#FFE89C" />
  </g>

  <!-- Elegant App Name Script -->
  <text x="256" y="415" font-family="'Cormorant Garamond', serif, Georgia" font-size="44" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    Casamento
  </text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="4">
    FACILITADO
  </text>
</svg>
